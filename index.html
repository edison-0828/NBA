<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="从选秀夜到揭幕战的篮球总经理模拟游戏">
<title>选秀之夜 · 篮球总经理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="theme.css">
<script src="league-data.js" defer></script>
<script src="player-skins.js" defer></script>
<script src="operations.js" defer></script>
<script src="franchise.js" defer></script>
<script src="game.js" defer></script>
</head>
<body class="arena-theme opening-mode">
<div class="shell">
  <header class="top">
    <div class="team-badge" id="team-badge"></div>
    <span class="management-label">篮球总经理</span>
  </header>
  <nav id="steps" aria-label="休赛期进度"></nav>
  <main id="game" tabindex="-1"></main>
  <nav id="franchise-nav" aria-label="主导航" hidden></nav>
</div>
<div class="sr" id="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div id="pack-layer" hidden></div>
<div id="rotate-lock" class="rotate-lock">
  <div class="rotate-card">
    <b>请横屏游戏</b>
    <p>把手机横过来，五人首发和卡包才会排开。</p>
    <button type="button" id="rotate-go">横屏开始</button>
  </div>
</div>
</body>
</html>
